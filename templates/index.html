<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Workout Plan</title>

    <!-- Bootstrap 5 for responsive and grid-based design -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS for vibrant and full-screen design -->
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">

    <!-- AOS (Animation on Scroll) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <i class="fas fa-dumbbell"></i> Workout Plans
</head>

<body class="bg-gradient">

    <!-- Full-Screen Hero Section -->
    <div class="container-fluid hero-section">
        <div class="row h-100 d-flex justify-content-center align-items-center text-center text-white">
            <div class="col-12">
                <h1 class="display-3">Get Your Personalized Workout Plan!</h1>
                <p class="lead mb-4">Enter your details, and we'll suggest a workout tailored for you!</p>
                <a href="#form-section" class="btn btn-lg btn-primary text-white">Get Started</a>
            </div>
        </div>
    </div>

    <!-- Form Section -->
    <div class="container py-5" id="form-section">
        <h2 class="text-center text-primary mb-4">Enter Your Details</h2>
        <form action="/generate_workout" method="POST">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="age" class="form-label">Age</label>
                        <input type="number" class="form-control" id="age" name="age" required>
                    </div>
                    <div class="mb-3">
                        <label for="weight" class="form-label">Weight (kg)</label>
                        <input type="number" class="form-control" id="weight" name="weight" required>
                    </div>
                    <div class="mb-3">
                        <label for="height" class="form-label">Height (cm)</label>
                        <input type="number" class="form-control" id="height" name="height" required>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100">Submit</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Footer Section -->
    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2025 Personalized Workout. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JS and AOS library -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

    <script>
        // Initialize AOS (Animation on Scroll)
        AOS.init();
    </script>
</body>

</html>
